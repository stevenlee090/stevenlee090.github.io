title: tangled reflections
author:
  name: Steven Lee
  email: stevenlee090@gmail.com

# Used in the page <meta> description (search results / link previews) and feed.xml.
description: >-
  Notes on software, robotics, machine learning, photography and travel.

# Build settings
# Theme comes from the Gemfile (pinned commit of jekyll/minima). Built and deployed by
# .github/workflows/pages.yml, not the legacy GitHub Pages builder.
theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Silence Sass deprecation noise coming from the theme's use of @import.
sass:
  quiet_deps: true
  silence_deprecations: [import]

# Google Analytics (only rendered when JEKYLL_ENV=production)
google_analytics: G-XMQLV7EHQ2

# Minima settings (v3 / master). See https://github.com/jekyll/minima#customization
minima:
  # classic | dark | auto | solarized-light | solarized-dark | solarized
  skin: auto

  # Pages linked in the site header, in order.
  nav_pages:
    - about.md

  # Show post excerpts on the homepage.
  show_excerpts: false

  # Default is "%b %-d, %Y" (e.g. Nov 14, 2023).
  # date_format: "%b-%d-%Y"

  # Icons come from Font Awesome; `icon: github` -> `fa-github`.
  social_links:
    - title: GitHub
      icon: github
      url: "https://github.com/stevenlee090"
    - title: Instagram
      icon: instagram
      url: "https://www.instagram.com/stevenlee090/"

  # The RSS link was hidden on the old site; keep it hidden.
  hide_site_feed_link: true
